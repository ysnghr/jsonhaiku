name: Release

# Tag-driven release. To cut 0.1.0:
#   1. bump __version__ in src/jsonhaiku/__about__.py
#   2. move the Unreleased section of CHANGELOG.md under a dated heading
#   3. git tag -a v0.1.0 -m "v0.1.0" && git push --tags
#
# Publishing uses PyPI Trusted Publishing (OIDC) -- no API token is stored.
# One-time setup: on PyPI, add a trusted publisher for repo ysnghr/jsonhaiku,
# workflow `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1 # no floating major tag is published
        with:
          enable-cache: true
      - name: Read package version
        id: version
        run: |
          version=$(grep -m1 '^__version__' src/jsonhaiku/__about__.py | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Changelog must mention this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "\[${{ steps.version.outputs.version }}\]" CHANGELOG.md
      - name: Build
        run: uv build
      - name: Validate metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    environment:
      name: pypi
      url: https://pypi.org/p/jsonhaiku
    permissions:
      id-token: write # required for Trusted Publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: true
          print-hash: true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
