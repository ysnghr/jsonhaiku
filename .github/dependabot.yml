version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Libraries should keep floors low; only surface updates that require a
    # change to a declared lower bound or a dev-tool pin.
    groups:
      dev-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
