# Install once per clone:  pre-commit install --install-hooks
# Run over everything:     pre-commit run --all-files
# Bump pinned revisions:   pre-commit autoupdate
default_language_version:
  python: python3
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "3.7.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs in its own managed env rather than via the archived
  # pre-commit/mirrors-mypy repo. `pass_filenames: false` is deliberate: mypy
  # needs the whole package to reason correctly, not the staged subset.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: python
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        additional_dependencies:
          - mypy==2.3.0
          - pytest>=8.0
          - hypothesis>=6.100
          - syrupy>=4.6
          - packaging>=24.0
          - nox>=2024.4.15

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
