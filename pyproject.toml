[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "jsonhaiku"
dynamic = ["version"]
description = "Compact, LLM-friendly descriptions of large JSON payloads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yasin Ugur" }]
maintainers = [{ name = "Yasin Ugur" }]
keywords = [
    "agents",
    "json",
    "json-schema",
    "llm",
    "mcp",
    "prompt-engineering",
    "schema-inference",
    "tokens",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
# The core library is intentionally dependency-free: it must be cheap to add to
# any project. Anything heavier (tokenizers, MCP transport, streaming parsers)
# lives behind an extra.
dependencies = []

[project.optional-dependencies]
# Feature extras -----------------------------------------------------------
tokens = ["tiktoken>=0.5"]
streaming = ["ijson>=3.2", "datasketch>=1.6"]

# Contributor extras -------------------------------------------------------
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.5",
    "syrupy>=4.6",
    "hypothesis>=6.100",
    "packaging>=24.0",
    "jsonschema>=4.21",
]
lint = ["ruff>=0.16,<0.18"]
typing = [
    "mypy>=1.15",
    # Type-check the test suite and the task runner too, so fixtures, helpers
    # and automation stay as honest as the library itself.
    "pytest>=8.0",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "packaging>=24.0",
    "jsonschema>=4.21",
    "nox>=2024.4.15",
]
# Recursive extras keep `dev` a single install target without duplicating pins.
dev = [
    "jsonhaiku[lint,streaming,test,tokens,typing]",
    "nox>=2024.4.15",
    "pre-commit>=3.7",
]

[project.scripts]
jsonhaiku = "jsonhaiku.cli:main"

[project.urls]
Homepage = "https://jsonhaiku.dev"
Documentation = "https://jsonhaiku.dev"
Repository = "https://github.com/ysnghr/jsonhaiku"
Changelog = "https://github.com/ysnghr/jsonhaiku/blob/main/CHANGELOG.md"
Issues = "https://github.com/ysnghr/jsonhaiku/issues"

# ---------------------------------------------------------------------------
# Build backend
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/jsonhaiku/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonhaiku"]

# An sdist should be enough to run the full test suite -- and nothing more.
# `documents/` is intentionally absent: it is the private implementation plan.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md", "noxfile.py"]

# ---------------------------------------------------------------------------
# Ruff -- linter and formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["documents"]

[tool.ruff.lint]
# Deliberately broad: it is far cheaper to enforce a rule from commit one than
# to retrofit it over a few thousand lines. Prune with intent, not annoyance.
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "ERA",    # eradicate (commented-out code)
    "EXE",    # flake8-executable
    "FA",     # flake8-future-annotations
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "COM812", # trailing-comma-missing -- owned by the formatter
    "D203",   # incompatible with D211 (google convention)
    "D213",   # incompatible with D212 (google convention)
    "ISC001", # single-line-implicit-concat -- owned by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Parsed by hatchling at build time; keep it a bare version constant.
"src/jsonhaiku/__about__.py" = ["I002"]
# A command line interface is allowed to write to stdout.
"src/jsonhaiku/cli.py" = ["T201"]
"noxfile.py" = ["D100", "S101"]
"tests/**/*.py" = [
    "ANN",     # test signatures are noise
    "D",       # docstrings optional in tests
    "PLR2004", # magic values are the point of a test
    "S101",    # assert is the point of a test
    "SLF001",  # tests may poke at privates
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["jsonhaiku"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# mypy -- strict from day one, before there is anything to fight about
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "noxfile.py"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]
pretty = true
show_error_code_links = true
sqlite_cache = true

# Third-party packages that ship no type information of their own.
[[tool.mypy.overrides]]
module = ["datasketch.*", "ijson.*", "jsonschema.*", "tiktoken.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `--import-mode=importlib` is the modern default for src-layout projects: it
# never mutates sys.path, so an import that works here works when installed.
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    # Bare `--cov` on purpose: it defers to `[tool.coverage.run] source`, which
    # measures by path. Naming the package instead (`--cov=jsonhaiku`) makes
    # coverage import it before tracing starts, which produces a spurious
    # `module-not-measured` warning.
    "--cov",
    "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: takes more than a second; deselect with '-m \"not slow\"'",
    "benchmark: measures performance rather than correctness",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
parallel = true
source = ["src/jsonhaiku"]
# Store paths relative to the project root so data files produced on Linux,
# macOS and Windows runners merge without needing per-OS path aliases.
relative_files = true

# Maps the many install locations a CI matrix produces onto one tree so that
# `coverage combine` can merge Linux, macOS and Windows runs.
[tool.coverage.paths]
source = ["src", "*/src", "*\\src", "*/site-packages", "*\\site-packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "if __name__ == .__main__.:",
]
