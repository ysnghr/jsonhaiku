[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "jsonhaiku-mcp"
dynamic = ["version"]
description = "MCP server for jsonhaiku — explore large JSON payloads from any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yasin Ugur" }]
keywords = [
    "claude",
    "cursor",
    "json",
    "llm",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jsonhaiku>=0.5.0.dev0",
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "coverage[toml]>=7.5",
]
lint = ["ruff>=0.16,<0.17"]
typing = [
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dev = ["jsonhaiku-mcp[lint,test,typing]"]

[project.scripts]
jsonhaiku-mcp = "jsonhaiku_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ysnghr/jsonhaiku"
Repository = "https://github.com/ysnghr/jsonhaiku"
Issues = "https://github.com/ysnghr/jsonhaiku/issues"

# ---------------------------------------------------------------------------
# Build backend
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/jsonhaiku_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonhaiku_mcp"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "I",      # isort
    "N",      # pep8-naming
    "PERF",   # perflint
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"src/jsonhaiku_mcp/server.py" = ["T201"]
"tests/**/*.py" = [
    "ANN",
    "D",
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["jsonhaiku_mcp"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/jsonhaiku_mcp"]
relative_files = true
